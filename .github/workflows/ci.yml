name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # One command runs the suite, the page-1/PDF/SVG parity contracts, the
      # rectangle-equivalence block and the full invariant sweep.  The sweep is
      # allowed a non-zero exit only when its verdict names zero TRUE FAILURES
      # (a DISCLOSED-only register); see backend/scripts/qa_gates.py.
      - name: Backend QA gates
        working-directory: backend
        run: python scripts/qa_gates.py

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck + production build
        working-directory: frontend
        run: npm run build
      - name: Report surface (L16 table, FAIL stamp, print wiring)
        working-directory: frontend
        run: npm run test:report-surface

