    <!-- The hero photograph is gone, and so is its preload.
         578 KB of JPEG was preloaded at fetchpriority="high" on every landing
         visit because it was the LCP element, and the mobile trace measured
         LCP 7.7 s with that image as the largest contentful paint. The hero is
         now a copy-led first screen with no marketing photograph and no 3D stage,
         so there is no hero image to preload — and nothing above the fold needs
         one. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Map data origins. The basemap is the app's largest dependency and its
         style, tiles and sprites all come from OpenFreeMap, so that one gets a
         full preconnect (DNS + TCP + TLS) started while the entry chunk is still
         parsing. The imagery/terrain hosts are only used when those modes are
         switched on, so they get a cheaper DNS-only hint — a preconnect for each
         would open connections most visits never use.

         The API origin is deliberately NOT listed: it is deployment-specific
         (VITE_API_URL), so a hard-coded preconnect here would warm the wrong host
         in every environment but localhost. -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
    <link rel="dns-prefetch" href="https://tiles.openfreemap.org">
    <link rel="dns-prefetch" href="https://server.arcgisonline.com">
    <link rel="dns-prefetch" href="https://a.tile.opentopomap.org">
    <link rel="dns-prefetch" href="https://s3.amazonaws.com">
    <!-- Fonts. Two independent decisions here, and both were measured.

         1. The stylesheet is fetched in parallel but NOT on the render-blocking
            path: a cross-origin stylesheet in the head holds the first paint
            until it arrives, and at the mobile preset that was ~890 ms of
            measured render blocking ("render-blocking-resources", the only entry
            left after this change). media="print" + onload applies it the moment
            it lands, one step after the shell paints. A/B on this rig (both
            builds, same machine, same minute): mobile FCP 2 648 -> 1 677 ms and
            SI 2 045 -> 1 870 ms, desktop FCP 529 -> 409 ms.

         2. display=optional rather than display=swap. This is a Core Web Vitals
            decision, not a typographic one, and it was forced by a measurement:
            with swap, the h1 and the hero subcopy painted in the fallback face and
            then REPAINTED when Inter finally arrived over the simulated slow 4G
            connection — and Chrome records that second paint as a new LCP
            candidate, because it is the same pixel area painted again. Removing
            the font files entirely from the same build moved mobile LCP 6.3 -> 4.7 s
            with nothing else changed, which is the size of the font's share.
            `optional` gives the font a very short window to arrive and otherwise
            keeps the fallback for the whole page load, so there is no late swap
            and therefore no late LCP: the text the reader reads is painted on the
            first frame either way. Repeat visits serve Inter from the HTTP cache,
            which is where the brand face is meant to live; the preconnects above
            keep the first visit's request as early as it can be. If the landing
            ever outgrows this trade, the next step is self-hosting a subset behind
            `rel=preload` + font-display:optional, not going back to swap. -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=optional"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=optional"
      />
    </noscript>
